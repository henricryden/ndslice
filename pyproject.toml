[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ndslice"
version = "0.10.0"
description = "Interactive N-dimensional numpy array viewer with FFT support"
readme = "README.md"
authors = [
    {name = "Henric Rydén", email = "henric.ryden@gmail.com"}
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
]
keywords = ["visualization", "numpy", "fft", "image-viewer", "data-visualization"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2.0",
    "pyqtgraph>=0.14.0",
    "PyQt6>=6.8.0",
    "platformdirs>=3.0.0",
    "h5py>=3.0.0",
    "scipy>=1.15.0",
    "pydicom>=2.4.0",
    "nibabel>=4.0.0",
    "imageio>=2.9.0",
    "imageio-ffmpeg>=0.4.2",
    "Pillow>=8.0.0",
]

[project.scripts]
ndslice = "ndslice.__main__:main"

[project.optional-dependencies]
dev = [
    "build>=0.10.0",
    "twine>=4.0.0",
]
[project.urls]
Homepage = "https://github.com/henricryden/ndslice"
Documentation = "https://github.com/henricryden/ndslice#readme"
"Bug Tracker" = "https://github.com/henricryden/ndslice/issues"

[tool.setuptools]
packages = ["ndslice"]
